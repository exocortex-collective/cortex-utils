name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # The queue lives in Postgres, and the defects this suite exists to catch --
    # partition coverage, EXTRACT returning numeric, an inverted FILTER -- are
    # invisible to a mock, which hands back whatever the code asked for. Tests
    # that skip everywhere are the same theatre they were written to replace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        run: uv run pytest -v

      - name: Fail if the live-Postgres tests were skipped
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        # A misconfigured service would turn this whole layer into silent skips,
        # which reads as coverage and is not.
        #
        # -p no:skipping is the whole point of this step. Without it the step
        # was decorative: pytest exits 0 when every test skips, so a guard
        # against silent skipping silently skipped. Measured -- 32 skipped,
        # exit 0. Disabling the plugin turns each skip into an error, so the
        # step exits 1 with no DSN and 0 with one.
        run: |
          uv run pytest tests/test_inspect_live.py tests/test_ops_live.py \
            tests/test_dead_letter_live.py tests/test_claim_token_guard_live.py \
            tests/test_schema_live.py tests/test_import_staging_live.py \
            -q --no-header -p no:cacheprovider -p no:skipping

  image:
    # Runs on PRs too, unlike `build`, which is gated on main. An image that
    # cannot start is not something to discover after merge.
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t utils:ci .

      - name: The image starts with no network
        run: |
          # --network none is the whole point: `uv run` re-resolves the project
          # on a fresh container and fetches hatchling from pypi, so the old
          # entrypoint could not boot without DNS. A smoke that gives the
          # container a network cannot catch that.
          #
          # --user root because the image cannot run as its declared appuser
          # (cortex-lhuj, pre-existing and tracked separately). The deployed
          # stack sets user: root for the same reason, so this matches
          # production rather than papering over it quietly.
          out=$(docker run --rm --network none --user root utils:ci --help 2>&1 || true)
          echo "$out" | tail -3
          echo "$out" | grep -q "Cortex operational utilities" || {
            echo "::error::the image could not start without the network"; exit 1; }

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ghcr.io/exocortex-collective/utils
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
