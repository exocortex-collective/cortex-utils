name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # The queue lives in Postgres, and the defects this suite exists to catch --
    # partition coverage, EXTRACT returning numeric, an inverted FILTER -- are
    # invisible to a mock, which hands back whatever the code asked for. Tests
    # that skip everywhere are the same theatre they were written to replace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        run: uv run pytest -v

      - name: Fail if the live-Postgres tests were skipped
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        # A misconfigured service would turn this whole layer into silent skips,
        # which reads as coverage and is not.
        #
        # -p no:skipping is the whole point of this step. Without it the step
        # was decorative: pytest exits 0 when every test skips, so a guard
        # against silent skipping silently skipped. Measured -- 32 skipped,
        # exit 0. Disabling the plugin turns each skip into an error, so the
        # step exits 1 with no DSN and 0 with one.
        run: |
          uv run pytest tests/test_inspect_live.py tests/test_ops_live.py \
            tests/test_dead_letter_live.py tests/test_claim_token_guard_live.py \
            tests/test_schema_live.py tests/test_import_staging_live.py \
            -q --no-header -p no:cacheprovider -p no:skipping

  image:
    # Runs on PRs too, unlike `build`, which is gated on main. An image that
    # cannot start is not something to discover after merge.
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t utils:ci .

      - name: The image starts with no network, as its declared user
        run: |
          # No --user override: the image must work as the appuser it declares,
          # or a regression to a root-only image would pass unnoticed.
          #
          # Do not set UV_OFFLINE here. It is a ROOT-ONLY escape hatch: as
          # root the pre-fix image boots with UV_OFFLINE=1 from the warm uv
          # cache the build leaves in /root. As appuser -- which is what this
          # step runs as -- that cache is unreadable (/root is drwx------) and
          # it fails either way, so this step discriminates with or without it.
          # Combined with a --user override it would stop discriminating.
          docker run --rm --network none utils:ci --help > /tmp/smoke.out 2>&1 \
            || { echo "::error::the image could not start without the network"; \
                 tail -5 /tmp/smoke.out; exit 1; }
          tail -3 /tmp/smoke.out
          grep -q "Cortex operational utilities" /tmp/smoke.out \
            || { echo "::error::the image started but did not print its CLI usage"; exit 1; }
          # Proves click subcommand dispatch. It adds no IMPORT coverage:
          # both probes load the same 24 cortex_utils modules, measured with
          # -X importtime. Neither reaches cortex_utils.introspect, which
          # cli.py imports lazily inside functions.
          docker run --rm --network none utils:ci queue --help > /tmp/smoke2.out 2>&1 \
            || { echo "::error::queue --help failed offline"; tail -5 /tmp/smoke2.out; exit 1; }

      - name: The smoke can actually fail (negative control)
        run: |
          # Asserts the PROPERTY by EXECUTING it, rather than linting this
          # file for ways to defeat it. Every round of review found another
          # spelling the lint did not know -- a bare || true, a commented-out
          # grep, continue-on-error, set +e, an echoed exit 1, exit 10 -- so
          # the list was never going to close. This step notices if the smoke
          # above can be weakened by any means, including one not yet invented.
          python3 - <<'PYEOF'
          import pathlib
          t = pathlib.Path("Dockerfile").read_text()
          target = "RUN uv sync --frozen --no-dev\n"
          i = t.rindex(target)   # the post-COPY sync, the one that fixes the bug
          pathlib.Path("Dockerfile.broken").write_text(t[:i] + t[i + len(target):])
          PYEOF
          # The BUILD must succeed, or this control proves nothing: an
          # unbuildable variant also exits non-zero and would look like a pass.
          docker build -q -f Dockerfile.broken -t utils:broken . > /dev/null \
            || { echo "::error::the negative control could not be BUILT, so it proves nothing"; \
                 exit 1; }
          if docker run --rm --network none utils:broken --help > /tmp/neg.out 2>&1; then
            echo "::error::the deliberately broken image BOOTED, so the smoke above cannot detect one"
            tail -5 /tmp/neg.out
            exit 1
          fi
          # And it must fail for the RIGHT reason. Any other failure (a bad
          # docker invocation, a missing image) would otherwise count as proof.
          grep -q "/app/.venv/bin" /tmp/neg.out \
            || { echo "::error::the broken image failed, but not on the baked venv -- this control is measuring something else"; \
                 tail -5 /tmp/neg.out; exit 1; }
          echo "negative control OK: the broken image fails on the baked venv, as expected"
          tail -2 /tmp/neg.out

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ghcr.io/exocortex-collective/utils
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
