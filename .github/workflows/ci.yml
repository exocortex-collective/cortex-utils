name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ubuntu-latest

    # The queue lives in Postgres, and the defects this suite exists to catch --
    # partition coverage, EXTRACT returning numeric, an inverted FILTER -- are
    # invisible to a mock, which hands back whatever the code asked for. Tests
    # that skip everywhere are the same theatre they were written to replace.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        run: uv run pytest -v

      - name: Fail if the live-Postgres tests were skipped
        env:
          CORTEX_TEST_DSN: "host=127.0.0.1 port=5432 user=postgres password=postgres dbname=postgres"
        # A misconfigured service would turn this whole layer into silent skips,
        # which reads as coverage and is not.
        #
        # -p no:skipping is the whole point of this step. Without it the step
        # was decorative: pytest exits 0 when every test skips, so a guard
        # against silent skipping silently skipped. Measured -- 32 skipped,
        # exit 0. Disabling the plugin turns each skip into an error, so the
        # step exits 1 with no DSN and 0 with one.
        run: |
          uv run pytest tests/test_inspect_live.py tests/test_ops_live.py \
            tests/test_dead_letter_live.py tests/test_claim_token_guard_live.py \
            tests/test_schema_live.py tests/test_import_staging_live.py \
            -q --no-header -p no:cacheprovider -p no:skipping

  image:
    # Runs on PRs too, unlike `build`, which is gated on main. An image that
    # cannot start is not something to discover after merge.
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t utils:ci .

      - name: The image boots with no network, as its declared user
        run: |
          # The checks live in ci/smoke.sh so the negative control below can
          # run the SAME ones against a broken image. Do not inline them here.
          #
          # Do not set UV_OFFLINE either. It is a ROOT-ONLY escape hatch: as
          # root the pre-fix image boots with UV_OFFLINE=1 from the warm uv
          # cache the build leaves in /root. As appuser -- which is what this
          # runs as -- that cache is unreadable (/root is drwx------) and it
          # fails either way. Combined with --user root it would stop
          # discriminating.
          ci/smoke.sh utils:ci \
            || { echo "::error::the image could not start without the network"; \
                 tail -5 /tmp/smoke.help /tmp/smoke.queue; exit 1; }
          tail -3 /tmp/smoke.help

      - name: The boot probe can actually fail (negative control)
        run: |
          # Asserts the property by EXECUTING it, rather than linting ci.yml
          # for ways to defeat it -- a list that never closed. Because it runs
          # ci/smoke.sh itself and not a copy, any weakening that makes the
          # probe exit 0 on an image that cannot start fails this step.
          #
          # That is a floor, not a proof the probe cannot be weakened: `set +e`
          # alone slips past, since the probe's last command fails on the
          # broken image anyway. test_the_boot_probe_* pins what this misses.
          python3 - <<'PYEOF'
          import pathlib
          t = pathlib.Path("Dockerfile").read_text()
          target = "RUN uv sync --frozen --no-dev\n"
          i = t.rindex(target)   # the post-COPY sync, the one that fixes the bug
          pathlib.Path("Dockerfile.broken").write_text(t[:i] + t[i + len(target):])
          PYEOF
          # The BUILD must succeed, or this control proves nothing: an
          # unbuildable variant also exits non-zero and would look like a pass.
          docker build -q -f Dockerfile.broken -t utils:broken . > /dev/null \
            || { echo "::error::the negative control could not be BUILT, so it proves nothing"; \
                 exit 1; }
          if ci/smoke.sh utils:broken /tmp/neg; then
            echo "::error::the broken image PASSED the boot probe, so the probe cannot reject one"
            exit 1
          fi
          # And it must fail for the RIGHT reason. Any other failure (a bad
          # docker invocation, a missing image) would otherwise count as proof.
          grep -q "/app/.venv/bin" /tmp/neg.help \
            || { echo "::error::the broken image failed, but not on the baked venv -- this control is measuring something else"; \
                 tail -5 /tmp/neg.help; exit 1; }
          echo "negative control OK: the probe rejects the broken image, on the baked venv"
          tail -2 /tmp/neg.help

  build:
    runs-on: ubuntu-latest
    needs: lint-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        env:
          IMAGE_NAME: ghcr.io/exocortex-collective/utils
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t $IMAGE_NAME:${{ github.sha }} -t $IMAGE_NAME:latest .
          docker push $IMAGE_NAME:${{ github.sha }}
          docker push $IMAGE_NAME:latest
